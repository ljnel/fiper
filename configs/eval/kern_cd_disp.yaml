defaults:
  - base

# Joint obs + action-chunk KernCD, rung 1 (docs/kern_cd_action_channel.md).
# Control for rung 2: mean chunk displacement (3 dims) instead of a signature,
# isolating "does *any* action channel help" from "does the signature help".
required_tensors:
  - "obs_embeddings"
  - "action_preds"

# Position channels only. Override the base optional_actions ([rotation]).
required_actions:
  - "position"
optional_actions: []

normalize_tensors:
  obs_embeddings: False
  action_preds: False

# KernCD support estimator (RBF on the standardised joint feature).
kernel: "rbf"
gamma: "median"
lam: 1.0e-5
rank: null
pivot: "rp"

# Action-chunk channel.
action_feature: "displacement"   # rung 1: mean end-minus-start position displacement
# g_a / g_o, applied after per-block standardisation + 1/sqrt(dim) balancing.
# 1.0 = exact equal contribution of the obs and action blocks (frozen default,
# chosen a priori; not selected on data - see docs/kern_cd_action_channel.md, A).
block_ratio: 1.0

hparams:
  model:
    kernel: ${eval.kernel}
    gamma: ${eval.gamma}
    lam: ${eval.lam}
    rank: ${eval.rank}
    pivot: ${eval.pivot}
    action_feature: ${eval.action_feature}
    block_ratio: ${eval.block_ratio}
