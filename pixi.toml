[workspace]
authors = ["Louis Nel <>"]
channels = ["conda-forge"]
name = "fiper"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
setuptools = "<82"  # required by torch 2.11.0+cu128
numpy = "*"
omegaconf = "*"
scipy = "*"
tqdm = "*"
hydra-core = "*"
scikit-learn = "*"
matplotlib = "*"
pandas = "*"
zarr = "*"
pillow = "*"
jupyterlab = "*"
ipykernel = "*"
plotly = ">=6.8.0,<7"
dash = ">=4.2.0,<5"

[pypi-dependencies]
# cu128 wheel from PyPI, not conda-forge: needs sm_120 kernels (RTX 5090)
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu128" }
cd_project = { git = "https://github.com/ljnel/cd_project", branch = "main" }

[tasks]
fiper = "python scripts/run_fiper.py"
results = "python scripts/results_generation.py"
lab = "jupyter lab"
